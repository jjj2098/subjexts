<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계열별 학과 안내 · 과목 평가방식·위계 · 2022 개정 교육과정 선택 과목 탐색기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5F1; --panel:#FFFFFF; --ink:#1B2333; --ink2:#4A5263; --ink3:#7C8494; --line:#DADDD4; --line2:#ECEEE8;
  --hl:#FFF3C4;
  --f-humanities:#6B4FA0; --f-social:#1E7B83; --f-natural:#3F7D3A; --f-engineering:#2B5AA6; --f-medical:#B33A55; --f-education:#A86E14; --f-arts:#B4532A; --f-special:#4A5263;
  --g0:#C2413B; --g1:#2B5AA6; --g2:#7A4FB0; --g3:#B7791F; --g4:#2F8A4E; --g5:#3C6E7E; --g6:#B0487A; --g7:#1E8C8C; --g8:#D0662A; --g9:#6B7280;
  --serif:"Gowun Batang","Noto Serif KR","AppleMyungjo","Batang",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--f-engineering);outline-offset:2px;border-radius:4px}
a{color:inherit}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;height:60px}
.brand{display:flex;flex-direction:column;line-height:1.2;white-space:nowrap}
.brand b{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand small{font-size:11.5px;color:#AEB6C6}
.menu-btn{display:none;background:none;border:1px solid #4A5570;border-radius:6px;padding:4px 9px;color:#fff}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;height:38px;border-radius:8px;border:1px solid #3A4560;background:#26304A;color:#fff;padding:0 12px 0 36px}
.search input::placeholder{color:#9AA3B5}
.search svg{position:absolute;left:11px;top:11px;opacity:.7}
.results{position:absolute;top:44px;left:0;right:0;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 12px 40px rgba(20,28,45,.28);max-height:70vh;overflow:auto;display:none;padding:6px 0}
.results.open{display:block}
.results h6{margin:8px 14px 4px;font-size:12px;color:var(--ink3);font-weight:600}
.results button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 14px}
.results button:hover,.results button.act{background:var(--line2)}
.results .rs{font-size:12.5px;color:var(--ink3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results mark{background:var(--hl);color:inherit;padding:0 1px}
.results .none{padding:10px 14px;color:var(--ink3);font-size:14px}
.nav{display:flex;gap:2px}
.nav button{background:none;border:0;color:#C9D0DD;padding:8px 12px;border-radius:6px;white-space:nowrap}
.nav button:hover{color:#fff;background:#2A3450}
.nav button.on{color:#fff;background:#34405F}
.nav .sh{display:none}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:282px 1fr;min-height:calc(100vh - 60px)}
aside{border-right:1px solid var(--line);background:#FAFBF8;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto;padding:14px 0 30px}
.tree-field{margin:0 0 4px}
.tree-field>button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;padding:8px 18px;font-weight:700;font-size:14.5px;text-align:left}
.tree-field>button .sw{width:10px;height:10px;border-radius:2px;flex:none}
.tree-field>button .cnt{margin-left:auto;font-weight:500;font-size:12px;color:var(--ink3)}
.tree-field>button .car{transition:transform .15s;color:var(--ink3);font-size:11px}
.tree-field.open>button .car{transform:rotate(90deg)}
.tree-body{display:none;padding:0 0 8px}
.tree-field.open .tree-body{display:block}
.tree-series{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 18px 3px 37px;font-size:13px;color:var(--ink2);font-weight:600}
.tree-series:hover{color:var(--ink)}
.tree-dept{display:block;width:100%;text-align:left;background:none;border:0;padding:3px 18px 3px 49px;font-size:13.5px;color:var(--ink);position:relative}
.tree-dept:hover{background:var(--line2)}
.tree-dept.on,.tree-series.on{background:#E4E8EF;font-weight:700}
.tree-dept.on::before{content:"";position:absolute;left:37px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--acc,var(--ink))}
.tree-sep{height:1px;background:var(--line);margin:10px 18px}
main{padding:28px 36px 80px;min-width:0}
.page{max-width:1080px;margin:0 auto}

/* ---------- generic ---------- */
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink3);margin-bottom:6px}
.crumb button{background:none;border:0;padding:0;color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.crumb button:hover{color:var(--ink)}
h1.title{font-family:var(--serif);font-size:40px;line-height:1.15;margin:0;letter-spacing:-.02em;font-weight:700}
.title-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--acc,var(--ink));padding-bottom:14px;margin-bottom:18px}
.title-row .pg{font-size:12.5px;color:var(--ink3);padding-bottom:6px}
.actions{margin-left:auto;display:flex;gap:6px;padding-bottom:4px}
.btn{background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 12px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.lead{font-size:16px;line-height:1.8;color:var(--ink2);max-width:74ch;margin:0 0 26px}
.sec{margin:0 0 30px}
.sec>h2{font-size:17px;margin:0 0 12px;display:flex;align-items:baseline;gap:10px;font-weight:700}
.sec>h2 small{font-size:12.5px;font-weight:400;color:var(--ink3)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.muted{color:var(--ink3)}
.empty{padding:28px;text-align:center;color:var(--ink3)}

/* ---------- subject lanes (signature) ---------- */
.lanes{overflow:hidden}
.lane{display:grid;grid-template-columns:104px 1fr;border-top:1px solid var(--line2)}
.lane:first-child{border-top:0}
.lane-h{padding:14px 14px;font-weight:700;font-size:14px;background:#F8F9F6;border-right:1px solid var(--line2);display:flex;flex-direction:column;gap:2px}
.lane-h small{font-weight:400;color:var(--ink3);font-size:12px}
.lane-b{padding:11px 12px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:0;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c,#999);border-radius:5px;padding:3px 9px 3px 8px;font-size:13.5px;line-height:1.35;white-space:nowrap}
button.chip:hover{border-color:var(--ink3);border-left-color:var(--c)}
.chip.dim{opacity:.35}
.chip.shared{background:#F2F5FA}
.chip .n{margin-left:7px;font-size:11.5px;color:var(--ink3)}
.gsub{width:100%;font-size:12.5px;font-weight:600;color:var(--ink2);margin:4px 0 0}
.gsub:first-child{margin-top:0}
.note{width:100%;font-size:12.5px;color:var(--ink3);margin-top:4px}
.dist{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 6px;background:var(--line2)}
.dist span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.legend b{font-weight:600;color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--ink)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-top:1px solid var(--line2);padding:9px 12px;vertical-align:top;text-align:left}
.tbl tr:first-child th,.tbl tr:first-child td{border-top:0}
.tbl th{width:112px;background:#F8F9F6;font-weight:600;white-space:nowrap;color:var(--ink2);border-right:1px solid var(--line2)}
.tbl td .sub{font-weight:600;color:var(--ink2);font-size:13px}
.recs{list-style:none;margin:0;padding:6px 16px}
.recs li{padding:8px 0 8px 18px;border-top:1px dashed var(--line);position:relative;font-size:14.5px}
.recs li:first-child{border-top:0}
.recs li::before{content:"";position:absolute;left:2px;top:17px;width:7px;height:2px;background:var(--acc,var(--ink))}
.region{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--line2)}
.region:first-child{border-top:0}
.region .rg{font-size:12.5px;font-weight:700;color:var(--acc,var(--ink2));padding-top:1px}
.region .us{font-size:14px}
.career{list-style:none;margin:0;padding:0}
.career li{padding:5px 0;border-top:1px dashed var(--line2);font-size:14px}
.career li:first-child{border-top:0}
.career b{font-weight:600}
.tips{list-style:none;counter-reset:t;margin:0;padding:4px 18px}
.tips li{padding:10px 0 10px 0;border-top:1px solid var(--line2);font-size:14.5px}
.tips li:first-child{border-top:0}
.sib{display:flex;flex-wrap:wrap;gap:6px}
.sib button{background:#fff;border:1px solid var(--line);border-radius:18px;padding:4px 12px;font-size:13.5px}
.sib button:hover{border-color:var(--acc,var(--ink))}
.sib button.on{background:var(--acc,var(--ink));color:#fff;border-color:transparent}
details.principle{margin-top:12px;font-size:13.5px;color:var(--ink2)}
details.principle summary{cursor:pointer;font-weight:600}
details.principle p{margin:8px 0 0;line-height:1.75}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:34px;align-items:end;margin-bottom:30px;border-bottom:1px solid var(--line);padding-bottom:26px}
.hero h1{font-family:var(--serif);font-size:44px;line-height:1.18;margin:0 0 12px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--ink2);max-width:52ch}
.howto{font-size:14px;color:var(--ink2);margin:0;padding:0;list-style:none}
.howto li{padding:8px 0;border-top:1px solid var(--line2)}
.howto li:first-child{border-top:0}
.howto b{color:var(--ink)}
.fieldmap{display:flex;flex-direction:column;gap:14px}
.fm{display:grid;grid-template-columns:150px 1fr;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fm-h{padding:16px;border-right:1px solid var(--line2);position:relative}
.fm-h::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--acc)}
.fm-h b{font-family:var(--serif);font-size:19px;display:block;line-height:1.3}
.fm-h small{color:var(--ink3);font-size:12.5px}
.fm-b{padding:10px 16px}
.fm-s{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--line2)}
.fm-s:first-child{border-top:0}
.fm-s>button{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:13.5px;color:var(--acc)}
.fm-s>button:hover{text-decoration:underline}
.fm-d{display:flex;flex-wrap:wrap;gap:4px 12px}
.fm-d button{background:none;border:0;padding:0;font-size:14px}
.fm-d button:hover{color:var(--acc);text-decoration:underline}

/* ---------- subjects view ---------- */
.subj-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.subj-tools input{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 12px;min-width:240px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 12px;font-size:13.5px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:#fff}
.subj-layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:22px;align-items:start}
.slist{max-height:calc(100vh - 220px);overflow:auto;position:sticky;top:80px}
.sgroup h4{margin:0;padding:9px 14px 5px;font-size:13px;display:flex;align-items:center;gap:7px;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line2)}
.sgroup h4 i{width:9px;height:9px;border-radius:2px;display:inline-block}
.srow{display:grid;grid-template-columns:1fr 90px 26px;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:5px 14px;font-size:14px}
.srow:hover{background:var(--line2)}
.srow.on{background:#E4E8EF;font-weight:700}
.srow .bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.srow .bar span{display:block;height:100%;background:var(--c)}
.srow .num{font-size:12.5px;color:var(--ink3);text-align:right}
.sdetail h2{font-family:var(--serif);font-size:32px;margin:0 0 4px;line-height:1.2}
.sdetail .meta{color:var(--ink2);font-size:14px;margin-bottom:16px}
.byfield{margin-bottom:14px}
.byfield h5{margin:0 0 6px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.byfield h5 i{width:9px;height:9px;border-radius:2px;background:var(--acc)}
.byfield .row{display:flex;flex-wrap:wrap;gap:6px}
.dchip{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13.5px;display:inline-flex;gap:6px;align-items:baseline}
.dchip:hover{border-color:var(--acc)}
.dchip small{font-size:11.5px;color:var(--ink3)}

/* ---------- compare ---------- */
.cmp-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.cmp-pick select{height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px;max-width:230px}
.cmp-wrap{overflow:auto}
.cmp{border-collapse:separate;border-spacing:0;font-size:14px;min-width:560px;width:100%}
.cmp th,.cmp td{border-bottom:1px solid var(--line2);padding:7px 10px;text-align:center;background:#fff}
.cmp thead th{position:sticky;top:0;z-index:2;background:#F8F9F6;border-bottom:1px solid var(--line);vertical-align:bottom}
.cmp thead th .dn{font-family:var(--serif);font-size:16px;font-weight:700;display:block;line-height:1.25}
.cmp thead th .rm{border:0;background:none;color:var(--ink3);font-size:12px;padding:2px 0}
.cmp thead th .rm:hover{color:var(--f-medical)}
.cmp td.sn{text-align:left;white-space:nowrap}
.cmp td.sn::before{content:"";display:inline-block;width:4px;height:14px;background:var(--c);margin-right:8px;vertical-align:-2px;border-radius:1px}
.cmp tr.lane-row td{background:#EEF0EA;text-align:left;font-weight:700;font-size:13px}
.cmp tr.all td{background:#FBF6E4}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.cmp td.c{color:var(--ink3);font-size:12.5px}

/* ---------- special ---------- */
.sp-tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.data{border-collapse:collapse;width:100%;font-size:13.5px}
.data th,.data td{border:1px solid var(--line2);padding:6px 8px;text-align:center}
.data thead th{background:#F8F9F6;font-weight:600}
.data td.l{text-align:left}
.data td.hi{font-weight:700}
.types{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.types .box{padding:16px 18px}
.types h3{margin:0 0 8px;font-size:16px}
.kv{font-size:13.5px;color:var(--ink2);margin-top:8px}
.kv b{color:var(--ink);font-weight:600;margin-right:6px}
.plain{list-style:none;margin:0;padding:0}
.plain li{padding:6px 0;border-top:1px dashed var(--line2);font-size:14px}
.plain li:first-child{border-top:0}
.uni-list{display:flex;flex-wrap:wrap;gap:6px}
.uni-list span{background:#fff;border:1px solid var(--line);border-radius:5px;padding:2px 9px;font-size:13.5px}

/* ---------- school fit ---------- */
.chip.off{opacity:.45;text-decoration:line-through;text-decoration-thickness:1px}
.chip.star::after{content:"★";margin-left:6px;color:#C9911B;font-size:11px;text-decoration:none}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.step>h3{margin:0 0 10px;font-size:15.5px;display:flex;align-items:center;gap:9px}
.step>h3 em{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12.5px;display:grid;place-items:center;flex:none}
.step .hint{color:var(--ink3);font-size:13px;margin:0 0 10px}
.row-btn{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--ink2);font-size:14px;background:#FCFDFB}
.drop.hot{border-color:var(--f-engineering);background:#F1F5FC}
.pastebox{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13.5px;font-family:inherit}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px;max-height:320px;overflow:auto;border:1px solid var(--line2);border-radius:8px;padding:10px}
.pick-grid label{display:flex;gap:7px;align-items:center;font-size:13.5px;padding:2px 0}
.pick-grid h6{grid-column:1/-1;margin:8px 0 2px;font-size:12.5px;color:var(--ink2);display:flex;gap:7px;align-items:center}
.pick-grid h6 i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tagwrap{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c,#999);border-radius:5px;padding:2px 6px 2px 8px;font-size:13.5px}
.tag button{border:0;background:none;color:var(--ink3);padding:0 2px;font-size:14px;line-height:1}
.tag button:hover{color:var(--f-medical)}
.fit-lane{display:grid;grid-template-columns:104px 1fr;border-top:1px solid var(--line2)}
.fit-lane:first-child{border-top:0}
.status{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);margin:8px 0 0}
.status b{color:var(--ink)}
.warn{background:#FFF7E6;border:1px solid #F0DDB0;border-radius:8px;padding:10px 12px;font-size:13.5px;color:#6B4E12}
.ok{background:#EEF6EF;border:1px solid #CADFCD;border-radius:8px;padding:10px 12px;font-size:13.5px;color:#2A5733}
.sheet h4{margin:18px 0 8px;font-size:15px}
@media (max-width:940px){.fit-lane{grid-template-columns:1fr}}
@media print{.drop,.pastebox,.pick-grid,.row-btn{display:none!important}}

footer.src{max-width:1080px;margin:40px auto 0;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--line);padding-top:12px}

/* ---------- responsive ---------- */
@media (max-width:1100px){.nav button{padding:8px 8px}.brand small{display:none}}
@media (max-width:940px){
  .wrap{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:60px;bottom:0;width:290px;z-index:25;transform:translateX(-100%);transition:transform .2s;box-shadow:8px 0 30px rgba(0,0,0,.12)}
  aside.open{transform:none}
  .menu-btn{display:block}
  .nav{position:fixed;bottom:0;left:0;right:0;background:var(--ink);justify-content:space-around;padding:6px 4px;z-index:30}
  .nav button{font-size:13px;padding:8px 6px;flex:1}
  .nav .lg{display:none}.nav .sh{display:inline}
  main{padding:20px 16px 90px}
  .grid2,.hero,.subj-layout,.types{grid-template-columns:1fr}
  .slist{position:static;max-height:none}
  h1.title{font-size:31px}
  .hero h1{font-size:32px}
  .fm,.fm-s{grid-template-columns:1fr}
  .fm-h{border-right:0;border-bottom:1px solid var(--line2)}
  .lane{grid-template-columns:1fr}
  .lane-h{flex-direction:row;gap:8px;align-items:baseline;border-right:0;border-bottom:1px solid var(--line2);padding:8px 12px}
  .brand b{font-size:16px}
}
@media (max-width:560px){.search{max-width:none}.brand{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- 과목 평가방식 · 과목 위계 ---------- */
:root{
  --t1:#2B5AA6; --t1b:#E6EDF9; --t2:#1E7B6B; --t2b:#E1F2EE; --t3:#B0601A; --t3b:#FBEFE2; --t4:#7A4FB0; --t4b:#F1EAFA;
  --s0:#2B5AA6; --s1:#1E7B6B; --s2:#B0601A; --s3:#7A4FB0;
}
.ev-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.ev-card>h2{font-size:16.5px;margin:0 0 12px;font-weight:700}
.ev h3{font-size:14.5px;margin:14px 0 8px}
.ev-input{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;padding:0 14px;background:#fff;font-size:15px}
.ev-lbl{font-size:12px;font-weight:700;color:var(--ink3);margin:12px 0 0}
.ev-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ev-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink2)}
.ev-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
span.ev-chip{cursor:default}
.ev-count{font-size:13px;color:var(--ink3);margin-top:10px}
.ev-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:16px}
.ev-lg{border-radius:10px;padding:11px 14px;border:1px solid transparent;text-align:left;background:none}
.ev-lg b{display:block;font-size:14.5px}
.ev-lg span{font-size:12.5px;color:var(--ink2)}
.ev-lg.t1{background:var(--t1b);border-color:#C9D6F0}.ev-lg.t1 b{color:var(--t1)}
.ev-lg.t2{background:var(--t2b);border-color:#BFE2D9}.ev-lg.t2 b{color:var(--t2)}
.ev-lg.t3{background:var(--t3b);border-color:#F0D5B8}.ev-lg.t3 b{color:var(--t3)}
.ev-lg.t4{background:var(--t4b);border-color:#DCCBF0}.ev-lg.t4 b{color:var(--t4)}
.ev-lg.on{outline:2px solid var(--ink);outline-offset:1px}
.ev-wrapx{overflow-x:auto}
.ev-tbl{width:100%;border-collapse:collapse;font-size:14px}
.ev-tbl th,.ev-tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
.ev-tbl th{background:#F8F9F6;font-size:12.5px;color:var(--ink2);font-weight:600;white-space:nowrap}
.ev-tbl.click tbody tr{cursor:pointer}
.ev-tbl.click tbody tr:hover{background:#F4F6FA}
.ev-tbl td.sj{font-weight:700}
.ev-badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.b-t1{background:var(--t1b);color:var(--t1)}.b-t2{background:var(--t2b);color:var(--t2)}
.b-t3{background:var(--t3b);color:var(--t3)}.b-t4{background:var(--t4b);color:var(--t4)}
.ev-kind{font-size:12px;color:var(--ink3);white-space:nowrap}
.ev-o{color:#2F7D3A;font-weight:700}.ev-x{color:#C4C9D2}
.ev-mark{background:var(--hl);padding:0 1px;border-radius:2px}
.ev-tag{font-size:11px;font-weight:700;color:var(--t1);background:var(--t1b);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.ev-empty{padding:28px;text-align:center;color:var(--ink3)}
.ev-note{font-size:13px;color:var(--ink2);background:#F6F7F3;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin:12px 0 0}
.ev-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.ev-bars{display:flex;height:42px;border-radius:8px;overflow:hidden;margin:6px 0 10px}
.ev-bars div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.ev-calc{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.ev-calc label{font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.ev-calc input{padding:7px 10px;border:1px solid var(--line);border-radius:7px;width:120px;background:#fff}
.ev-result{margin-top:12px;padding:14px;border-radius:8px;background:#EEF2F9;font-size:15px;display:none}
.ev-result.on{display:block}
.ev-result big{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--ink)}
.ev ul.ev-ul{margin:4px 0;padding-left:20px;font-size:14px}.ev ul.ev-ul li{margin:4px 0}
.lnkbtn{background:none;border:0;padding:0;color:var(--f-engineering);text-decoration:underline;text-underline-offset:2px;font-size:inherit;font-weight:600}
.lnkbtn:hover{color:var(--ink)}

/* modal */
.ev-mask{position:fixed;inset:0;background:rgba(20,28,45,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
.ev-mask.on{display:flex}
.ev-modal{background:#fff;border-radius:14px;max-width:580px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.ev-modal h2{font-family:var(--serif);font-size:26px;margin:6px 0 2px}
.ev-modal h3{font-size:14.5px;margin:16px 0 0}
.ev-meta{color:var(--ink3);font-size:13px}
.ev-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.ev-it{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13.5px}
.ev-it b{display:block;font-size:12px;color:var(--ink3);font-weight:500}
.ev-it.no{opacity:.45}
.ev-close{float:right}
.ev-mbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* 과목으로 찾기 화면에 붙는 패널 */
.ev-panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 14px;margin:0 0 18px}
.ev-prow{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-top:1px dashed var(--line2);font-size:14px}
.ev-prow:first-child{border-top:0}
.ev-plab{font-size:12.5px;font-weight:700;color:var(--ink2)}

/* 위계도 */
.hy-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.hy-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2);align-items:center}
.hy-legend i{display:inline-block;width:26px;height:0;border-top:2.5px solid #9AA4B6;vertical-align:middle;margin-right:5px}
.hy-legend i.d{border-top-style:dashed}
.hy-wrap{position:relative;margin-top:16px}
.hy-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:34px;position:relative;z-index:1}
.hy-col{display:flex;flex-direction:column}
.hy-head{font-size:13.5px;font-weight:700;text-align:center;padding-bottom:6px;border-bottom:3px solid;margin-bottom:12px}
.hy-head small{display:block;font-weight:400;font-size:11.5px;color:var(--ink3)}
.hy-head.s0{color:var(--s0)}.hy-head.s1{color:var(--s1)}.hy-head.s2{color:var(--s2)}.hy-head.s3{color:var(--s3)}
.hy-body{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:11px}
.hy-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.hy-svg>path{fill:none;stroke:#B9C1CF;stroke-width:2;transition:opacity .2s}
.hy-svg>path.dash{stroke-dasharray:5 4}
.hy-svg>path.on{stroke:var(--ink);stroke-width:2.6}
.hy-wrap.sel .hy-svg>path:not(.on){opacity:.18}
.hy-node{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-left:5px solid;border-radius:8px;padding:7px 10px;transition:opacity .2s,box-shadow .2s;position:relative}
.hy-node:hover{box-shadow:0 2px 8px rgba(30,40,70,.12)}
.hy-node.s0{border-left-color:var(--s0)}.hy-node.s1{border-left-color:var(--s1)}.hy-node.s2{border-left-color:var(--s2)}.hy-node.s3{border-left-color:var(--s3)}
.hy-node.alt{border-style:dashed;border-left-style:solid;background:#FAFBF8}
.hy-node b{display:block;font-size:14px;line-height:1.35}
.hy-node .nd{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.4}
.hy-node .pre{display:none;font-size:11.5px;color:var(--f-engineering);margin-top:4px}
.hy-node.cur{outline:3px solid #8FA7E0;outline-offset:1px}
.hy-wrap.sel .hy-node:not(.act){opacity:.28}
.hy-csat{display:inline-block;font-size:10.5px;font-weight:700;background:#FFF1C7;color:#8A5A00;border-radius:5px;padding:1px 6px;margin-left:4px;vertical-align:2px}
.hy-wrap.stack .hy-grid{grid-template-columns:1fr;gap:18px}
.hy-wrap.stack .hy-svg{display:none}
.hy-wrap.stack .hy-node .pre{display:block}
.hy-detail{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.hy-detail h3{font-family:var(--serif);font-size:24px;margin:8px 0 4px}
.hy-detail .dc{margin:0;color:var(--ink2);font-size:14px}
.hy-stg{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;margin-right:4px}
.hy-lnk{background:none;border:0;padding:0;color:var(--f-engineering);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.hy-hint{color:var(--ink3);font-size:13.5px;margin:0}
@media (max-width:640px){.ev-hm{display:none}.ev-prow{grid-template-columns:1fr}}
@media print{.ev-mask{display:none!important}}
@media (max-width:940px){.nav{overflow-x:auto;scrollbar-width:none}.nav button{flex:1 0 auto;font-size:12.5px;padding:8px 6px}}

물리, 화학, 생명과학, 지구과학 등 다양한 과학 개념을 융합하여 자연 현상을 깊이 있게 탐구함.","학술 자료를 해석하고 논문을 작성하는 과정이 포함되므로 영어 독해 및 작문 능력이 우수한 경우 학습과 연구에 유리함.","기초과학과 응용과학이 긴밀히 연결되기 때문에 IT, 인공지능, 바이오 기술 등 다양한 분야와 융합할 수 있는 사고력이 요구됨.","실험과 연구가 중심이 되는 학문이므로 끈기와 도전 정신이 필요하며, 예상과 다른 결과가 나왔을 때도 그 원인을 분석하고 탐구하려는 태도가 중요함."],"depts":["d219","d220","d221","d222","d223","d224","d225","d226"]},{"id":"s7","name":"생활과학 계열","field":"자연 분야","page":228,"related":["식품영양학과","의류학과"],"subjects":{"일반 선택":{"groups":[{"group":null,"items":["독서와 작문","문학","대수","미적분Ⅰ","확률과 통계","영어Ⅰ","영어Ⅱ","영어 독해와 작문","세계사","사회와 문화","화학","생명과학","기술·가정","정보","제2외국어"]}],"note":""},"진로 선택":{"groups":[{"group":null,"items":["미적분Ⅱ","경제","물질과 에너지","화학 반응의 세계","세포와 물질대사","생물의 유전","생활과학 탐구"]}],"note":""},"융합 선택":{"groups":[{"group":null,"items":["실용 통계"]}],"note":""}},"tips":["식품과 의류는 실생활과 밀접한 학문이므로, 일상 속 관심 주제를 관찰하고 탐구하는 태도가 중요함.","식품영양학과는 식품 성분과 영양소 대사를 과학적으로 분석하는 학문이므로, 화학과 생명과학 과목의 이수가 전공 이해에 도움이 됨.","의류학과는 패션 디자인, 섬유 소재, 복식사 등을 종합적으로 다루므로, 화학 지식과 디자인 감각, 세계사· 문화사에 대한 이해가 함께 요구됨.","식품·패션 산업은 빠르게 변화하는 소비 트렌드와 연결되므로 K-푸드, 지속가능 패션, 친환경 소재 등 최신 산업 흐름에 대한 관심이 필요함.","소비자의 행동, 산업의 구조, 시장의 흐름을 이해하기 위해 경제·경영 관련 개념에 대한 관심이 필요함.","전공 관련 기초 소양을 쌓기 위해 화학, 생명과학, 세계사, 확률과 통계, 경제 등의 과목을 선택하는 것이 진로 설계에 실질적으로 도움이 됨."],"depts":["d229","d230"]},{"id":"s8","name":"농학 계열","field":"자연 분야","page":232,"related":["식물자원학과","동물자원학과","원예학과","조경학과"],"subjects":{"일반 선택":{"groups":[{"group":null,"items":["독서와 작문","문학","대수","미적분Ⅰ","확률과 통계","영어Ⅰ","영어Ⅱ","영어 독해와 작문","물리학","화학","생명과학","지구과학","정보"]}],"note":""},"진로 선택":{"groups":[{"group":null,"items":["미적분Ⅱ","인공지능 수학","한국지리 탐구","도시의 미래 탐구","역학과 에너지","물질과 에너지","화학 반응의 세계","세포와 물질대사","생물의 유전","지구시스템과학","생활과학 탐구"]}],"note":""},"융합 선택":{"groups":[{"group":null,"items":["실용 통계","기후변화와 환경생태"]}],"note":""}},"tips":["자연과 생명과학에 대한 관심과 함께, 농업과 환경 변화에 흥미가 있는 학생에게 유리함.","식물자원학과·원예학과·동물자원학과는 생명과학·화학 과목의 이수가 전공 이해에 도움이 됨.","조경학과는 생명과학뿐만 아니라 미술 과목 이수도 공간 설계 능력과 디자인 감각을 기르는 데 도움이 됨.","스마트팜, 도시농업, 지속가능한 농업 기술 등 최신 산업 흐름에 대한 관심이 필요함.","기후변화, 식량자원, 환경보전 문제를 종합적으로 이해하고 사고하는 능력이 중요함.","성분 분석, 통계 해석, 생육 환경 이해를 위해 확률과 통계, 화학, 생명과학 과목의 이수가 필요하며, 환경과 지역 특성을 이해하는 데에 기후변화와 지속가능한 세계, 세계시민과 지리 등의 과목 수강이 도움이 됨."],"depts":["d233","d234","d235","d236"]},{"id":"s9","name":"기계·전기·전자 계열","field":"공학 분야","page":240,"related":["기계공학과","자동차공학과","전기공학과","전자공학과","제어계측공학과","로봇공학과","항공우주공학과","항공운항학과"],"subjects":{"일반 선택":{"groups":[{"group":null,"items":["대수","미적분Ⅰ","확률과 통계","물리학","화학","지구과학","기술·가정","정보"]}],"note":""},"진로 선택":{"groups":[{"group":null,"items":["기하","미적분Ⅱ","인공지능 수학","역학과 에너지","전자기와 양자","물질과 에너지","화학 반응의 세계","지구시스템과학","행성우주과학","로봇과 공학세계","인공지능 기초","데이터 과학"]}],"note":""},"융합 선택":{"groups":[{"group":null,"items":["수학과제 탐구","융합과학 탐구","창의 공학 설계","지식 재산 일반","소프트웨어와 생활"]}],"note":""}},"tips":["수학은 공학 전반에서 필수적으로 활용되는 기초 학문으로, 미적분, 확률과 통계, 선형대수 등은 물리적 변화 해석, 회로 분석, 공정 제어 등 다양한 공학 문제 해결과 직결되므로 수학적 사고력과 논리적 문제 해결 능력을 체계적으로 기르는 것이 중요함.","물리학, 역학과 에너지, 전자기와 양자 과목은 기계, 전기, 항공 등 공학 계열 전공과 직접적으로 연계되며, 고등학교에서의 학습 경험이 전공 이해도와 적응력에 중요한 기반으로 작용함.","최근 들어 공학은 융합 공학 관점에서 다양한 학문이 연계되어 실생활 문제를 해결하는 방향으로 발전하고 있으며, 하드웨어 및 소프트웨어 기초 역량은 로봇, 자율주행, 피지컬 AI 등에서 핵심 경쟁력으로 작용하고 있기 때문에 다양한 교과의 통합적 이해와 폭넓은 기초 개념 수용 태도가 필요함."],"depts":["d241","d242","d243","d244","d245","d246","d247","d248"]},{"id":"s10","name":"건축·환경 계열","field":"공학 분야","page":250,"related":["건축학과","건축공학과","교통공학과","도시공학과","토목공학과","해양공학과","환경공학과"],"subjects":{"일반 선택":{"groups":[{"group":null,"items":["대수","미적분Ⅰ","확률과 통계","물리학","화학","생명과학","지구과학","기술·가정","정보"]}],"note":""},"진로 선택":{"groups":[{"group":null,"items":["기하","미적분Ⅱ","도시의 미래 탐구","역학과 에너지","전자기와 양자","물질과 에너지","로봇과 공학세계","인공지능 기초"]}],"note":""},"융합 선택":{"groups":[{"group":null,"items":["창의 공학 설계","지식 재산 일반","융합과학 탐구","과학의 역사와 문화"]}],"note":""}},"tips":["인간이 살아가는 공간과 환경, 주거 문화를 중심으로 생활의 편리함을 추구하는 실용적인 학문 계열임.","수학과 물리학 같은 공학의 기초 과목뿐 아니라, 역사와 예술 감각도 필요하며 지리적·사회적·환경적 요소들을 종합적으로 이해하는 융합 능력이 요구됨.","창의적인 설계 능력과 더불어 정교함과 협업 능력이 중요하고, 다양한 공간 관련 분야를 경험해 보며 자신의 관심 분야를 찾아가려는 자세가 필요함."],"depts":["d251","d252","d253","d254","d255","d256","d257"]},{" ms":["윤리문제 탐구"]}],"note":""}},"tips":["보건 분야에서 기본적으로 필요한 교과는 과학 교과임. 과학 교과의 생명과학과 화학 관련 과목은 학습 및 직무 수행의 기본이 되는 매우 중요한 교과이므로 잘 학습해야 함. 특히, 생명과학 과목은 책임 학습이 필요함.","국어, 영어, 사회 교과의 이수도 필요함. 국어 교과는 의사소통 능력과 논리적 사고력 향상을 위해 중요하고, 영어 교과는 직무 관련 서적의 이해 및 외국인 환자 응대 등을 위해 필요함. 특히 대면 활동이 많은 직군의 특성을 고려하여 사람과 사회를 이해하는 데 도움이 되는 사회 교과, 윤리 교과의 이수도 권장함."],"depts":["d281","d282","d283","d284","d285","d286","d287"]},{"id":"s14","name":"의약학 계열","field":"보건·의약학 분야","page":288,"related":["수의학과","약학과","의예과","치의예과","한의예과"],"subjects":{"일반 선택":{"groups":[{"group":null,"items":["대수","미적분Ⅰ","확률과 통계","물리학","화학","생명과학","사회와 문화","현대사회와 윤리"]}],"note":""},"진로 선택":{"groups":[{"group":null,"items":["미적분Ⅱ","윤리와 사상","인문학과 윤리","물질과 에너지","화학 반응의 세계","세포와 물질대사","생물의 유전","인공지능 기초","데이터 과학","보건"]}],"note":""},"융합 선택":{"groups":[{"group":null,"items":["과학의 역사와 문화","융합과학 탐구","윤리문제 탐구"]}],"note":""}},"tips":["의학분야에서 기본적으로 필요한 교과는 과학 교과와 수학 교과임. 과학 교과의 생명과학 및 화학 관련 과목은 의료 분야 학습에 매우 중요하고, 수학 교과는 의학 통계 및 연구에 필요한 데이터 분석 및 논리적인 수학 능력을 기르기 위해 꼭 필요하므로 모두 충실히 학습해야 함.","국어, 영어 교과의 이수도 필요함. 학습량이 많고 다각적인 학문적 접근 능력과 높은 사고력 및 이해력이 필요한 분야이므로 의사소통 능력과 논리적 사고력 향상을 위한 국어 교과, 국제적인 의학 연구 및 문헌 이해를 위한 영어 교과, 사람과 세상을 이해하고 공감할 수 있게 해주는 사회 교과 학습이 모두 필요함."],"depts":["d289","d290","d291","d292","d293"]},{"id":"s15","name":"교육 계열","field":"교육 분야","page":296,"related":["언어 교과 교육과","사회 교과 교육과","수학교육과","과학 교과 교육과","교육학과","초등교육과","유아교육과"],"subjects":{"일반 선택":{"groups":[{"group":"인문, 사회 계열 교육과","items":["화법과 언어","독서와 작문","문학","대수","미적분Ⅰ","확률과 통계","영어Ⅰ","영어Ⅱ","영어 독해와 작문","세계시민과 지리","세계사","사회와 문화","현대사회와 윤리","제2외국어","한문"]},{"group":"자연 계열 교육과","items":["화법과 언어","독서와 작문","문학","대수","미적분Ⅰ","확률과 통계","영어Ⅰ","영어Ⅱ","영어 독해와 작문","물리학","화학","생명과학","지구과학","기술·가정","정보"]}],"note":"초등교육과, 유아교육과는 계열과 관계 없이 좋아하는 과목이라면 적극적으로 이수할 필요가 있으며, 예체능 과목도 부담이 되지 않는 선에서 적극적으로 이수해야 함."},"진로 선택":{"groups":[{"group":"인문, 사회 계열 교육과","items":["주제 탐구 독서","영어 발표와 토론","한국지리 탐구","동아시아 역사 기행","정치","법과 사회","경제","윤리와 사상","교육의 이해"]},{"group":"자연 계열 교육과","items":["주제 탐구 독서","기하","미적분Ⅱ"," 5.7,88],["진로 선택","여행지리",21.8,20,24.5,22.2,14.3,16]],"note":"열린전공학부(인문)는 언어적 기초 역량과 폭넓은 사회적 소양을 핵심 평가 요소로 삼습니다. 사회 교과목 이수 현황 분석 결과, 특정 과목의 이수 여부를 강제하기보다 개인의 관심사에 따른 사회 교과 이수를 긍정적으로 평가하고 있음을 알 수 있습니다. 이는 국어와 영어의 탄탄한 기초 학업 역량을 바탕으로, 자신의 흥미에 부합하는 사회 교과적 소양을 충실히 쌓는 것만으로도 전공 탐색을 위한 준비가 충분함을 시사합니다."},{"title":"열린전공학부(자연) 과학 교과목 이수 현황(비율)","rows":[["일반 선택","물리학Ⅰ",57.8,98,94,66.3,88,96],["일반 선택","화학Ⅰ",91.4,100,100,94.6,98,96],["일반 선택","생명과학Ⅰ",86.7,86,86,88,86,84],["일반 선택","지구과학Ⅰ",57,42,44,54.5,50,40],["진로 선택","물리학Ⅱ",41.8,88,84,49.2,74,80],["진로 선택","화학Ⅱ",79.8,94,96,85.1,94,88],["진로 선택","생명과학Ⅱ",71.5,48,42,71.3,58,56],["진로 선택","지구과학Ⅱ",25.5,10,14,20.8,16,16]],"note":"열린전공학부(자연)의 경우 열린전공학부(인문)과 다소 다른 특징을 보이고 있습니다. 과학 교과 이수 현황을 분석해보면 지원자 전체에서는 화학과 생명과학의 이수 비율이 높게 나타나지만, 최종 합격자를 기준으로 살펴보면 화학과 물리학의 이수 비율이 눈에 띄게 상승하는 것을 확인할 수 있습니다."}]},"cautions":["특정 진로를 확정하고 준비해 온 학생이라면 관심 분야에 대한 심화와 확장을 통해 학업적 깊이를 증명하는 과목 선택이 필요합니다. 반면, 다양한 분야를 탐색 중인 학생이라면 과목 선택의 계기와 그에 따른 변화, 성장의 과정을 입체적으로 보여줌으로써 폭넓은 잠재력을 증명해야 합니다.","전공자율선택제는 학생의 전공 선택권을 폭넓게 보장하는 제도이지만, 대학별 운영 방식에 따른 세부 제약 사항을 반드시 확인해야 합니다. 전공 진입 시기와 조건이 대학마다 상이할 뿐만 아니라, 특정 전공에 희망자가 집중될 경우 성적순으로 인원을 제한하기도 합니다. 또한, 단일 전공이 아닌 다전공(복수전공) 이수를 의무화하는 사례도 있으므로 지원 전 대학별 학사 운영 규정을 면밀히 검토하는 주의가 필요합니다."]},"contract":{"name":"계약학과","page":340,"desc":"국가·지방자치단체 또는 산업체 등과의 계약에 의해 정원 외로 특별 교육과정을 설치 운영할 수 있는 학위과정이다.","typeName":"채용조건형","typeDesc":"산업체 등에서 채용을 조건으로 학자금 지원 계약을 체결하고 특별한 교육과정을 이수하면 졸업 후 취업이 보장되는 형태이며 고등학교 졸업(예정)자를 대상으로 신입학 선발합니다.","rows":[{"kind":"조기 취업형","feature":"1학년 교육 후 2~3학년 때 취업과 학업 병행","examples":["가천대: 게임·영상학과, 미래자동차학과, 바이오의료기기학과, 반도체·디스플레이전공, 반도체설계학과","한국공학대: 스마트전자공학과, AI소프트웨어학과, IT융합디자인공학, 스마트그린소재공학","한양대(ERICA): 스마트융합공학부 등"]},{"kind":"군의무 복무형","feature":"졸업 후 장교 임관 및 첨단 분야 병과 지정 근무","examples":["고려대: 사이버국방학과","세종대: 국방시스템공학과, 항공시스템공학","아주대: 국방디지털융합학과 등","한양대(ERICA): 국방지능정보융합공학부(국방전략기술공학과)"]},{"kind":"기업체 취업형","feature":"기업체와 협약을 통해 졸업 후 해당 기업 취업","examples":["고려대: 반도체공학과(SK하이닉스), 스마트모빌리티학과(현대자동차), 차세대통신학과(삼성전자)","서강대: 시스템반도체공학과(SK하이닉스)","성 인공지능 수학","경제","인공지능 기초","데이터 과학","논리와 사고"],["기하","미적분Ⅱ","역학과 에너지","인공지능 수학","로봇과 공학세계","인공지능 기초","데이터 과학","논리와 사고"]],"융합 선택":[["수학과제 탐구","기후변화와 지속가능한 세계","기후변화와 환경생태","융합과학 탐구","창의 공학 설계","지식 재산 일반"],["수학과제 탐구","융합과학 탐구","창의 공학 설계","지식 재산 일반"],["실용 통계","수학과제 탐구","사회문제 탐구","금융과 경제생활","융합과학 탐구","창의 공학 설계","지식 재산 일반","논술"],["실용 통계","수학과제 탐구","사회문제 탐구","기후변화와 지속가능한 세계","융합과학 탐구","창의 공학 설계","소프트웨어와 생활"]]}}}}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const FKEY={}; D.fields.forEach(f=>FKEY[f.name]=f.key);
const SER={}; D.series.forEach(s=>SER[s.id]=s);
const DEP={}; D.depts.forEach(d=>DEP[d.id]=d);
const BYNAME={}; D.depts.forEach(d=>BYNAME[d.name]=d);
BYNAME['정보통신공학과']=BYNAME['정보통신학과'];
const LANES=['일반 선택','진로 선택','융합 선택'];
const GORDER=['국어','수학','영어','사회','과학','기술·가정/정보','제2외국어/한문','체육','예술','교양'];
const gIdx=s=>{const g=D.groups[s];const i=GORDER.indexOf(g);return i<0?9:i};
const gColor=s=>`var(--g${gIdx(s)})`;
const acc=field=>`var(--f-${FKEY[field]||'special'})`;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const main=$('#main'), side=$('#side');

/* ---- subject index: subject -> [{dept,lane}] ---- */
const SIDX={};
D.depts.forEach(d=>LANES.forEach(l=>(d.subjects[l]||[]).forEach(s=>{(SIDX[s]=SIDX[s]||[]).push({d,l})})));
const SUBJ_SER={};
D.series.forEach(se=>LANES.forEach(l=>{const o=se.subjects[l];if(!o)return;o.groups.forEach(g=>g.items.forEach(s=>{(SUBJ_SER[s]=SUBJ_SER[s]||new Set()).add(se.id)}))}));
const subjLane=s=>{const c={};(SIDX[s]||[]).forEach(x=>c[x.l]=(c[x.l]||0)+1);let best=null,b=-1;for(const k in c)if(c[k]>b){b=c[k];best=k}
  if(!best){for(const se of D.series)for(const l of LANES){const o=se.subjects[l];if(o&&o.groups.some(g=>g.items.includes(s)))return l}}
  return best};

/* ---- state ---- */
let compareList=[];
let showSeriesSubjects=false;

/* ---- sidebar ---- */
function buildSide(){
  let h='';
  D.fields.forEach(f=>{
    const ss=D.series.filter(s=>s.field===f.name);
    const n=ss.reduce((a,s)=>a+s.depts.length,0);
    h+=`<div class="tree-field" data-field="${esc(f.name)}" style="--acc:${acc(f.name)}"><button class="tf" aria-expanded="false"><span class="car">▶</span><span class="sw" style="background:${acc(f.name)}"></span>${esc(f.name)}<span class="cnt">${n}</span></button><div class="tree-body">`;
    ss.forEach(s=>{
      h+=`<button class="tree-series" data-series="${s.id}">${esc(s.name)}</button>`;
      s.depts.forEach(id=>{h+=`<button class="tree-dept" data-dept="${id}">${esc(DEP[id].name)}</button>`});
    });
    h+='</div></div>';
  });
  h+='<div class="tree-sep"></div>';
  h+=`<div class="tree-field open" style="--acc:var(--f-special)"><button class="tf" aria-expanded="true"><span class="car">▶</span><span class="sw" style="background:var(--f-special)"></span>기타 모집 단위</button><div class="tree-body">
    <button class="tree-dept" data-special="autonomy" style="padding-left:37px">자율전공</button>
    <button class="tree-dept" data-special="contract" style="padding-left:37px">계약학과</button>
    <button class="tree-dept" data-special="advanced" style="padding-left:37px">첨단학과</button></div></div>`;
  side.innerHTML=h;
  side.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.classList.contains('tf')){const f=b.parentElement;f.classList.toggle('open');b.setAttribute('aria-expanded',f.classList.contains('open'));return}
    if(b.dataset.dept)go('dept/'+b.dataset.dept);
    else if(b.dataset.series)go('series/'+b.dataset.series);
    else if(b.dataset.special)go('special/'+b.dataset.special);
    if(innerWidth<=940)side.classList.remove('open');
  });
}
function markSide(kind,id){
  side.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  let el=null;
  if(kind==='dept')el=side.querySelector(`[data-dept="${id}"]`);
  if(kind==='series')el=side.querySelector(`[data-series="${id}"]`);
  if(kind==='special')el=side.querySelector(`[data-special="${id}"]`);
  if(el){el.classList.add('on');const f=el.closest('.tree-field');if(f&&!f.classList.contains('open')){f.classList.add('open')}
    const r=el.getBoundingClientRect(),sr=side.getBoundingClientRect();if(r.top<sr.top||r.bottom>sr.bottom)el.scrollIntoView({block:'center'})}
}

/* ---- helpers ---- */
function chip(s,opts={}){
  const n=opts.count?`<span class="n">${(SIDX[s]||[]).length}</span>`:'';
  const off=(school.subjects.length&&!schoolHas(s))?' off':'';
  const tip=off?' · 우리 학교 미개설':(school.subjects.length?' · 우리 학교 개설':'');
  return `<button class="chip ${opts.cls||''}${off}${opts.star?' star':''}" style="--c:${gColor(s)}" data-subj="${esc(s)}" title="${esc(D.groups[s]||'')}${tip} · 이 과목을 추천하는 학과 보기">${esc(s)}${n}</button>`;
}
function distBar(list){
  const c={};list.forEach(s=>{const g=GORDER[gIdx(s)];c[g]=(c[g]||0)+1});
  const tot=list.length||1;
  const segs=GORDER.filter(g=>c[g]).map(g=>`<span style="width:${c[g]/tot*100}%;background:var(--g${GORDER.indexOf(g)})" title="${g} ${c[g]}과목"></span>`).join('');
  const leg=GORDER.filter(g=>c[g]).map(g=>`<span><i style="background:var(--g${GORDER.indexOf(g)})"></i>${g} <b>${c[g]}</b></span>`).join('');
  return `<div class="dist" role="img" aria-label="교과별 과목 수">${segs}</div><div class="legend">${leg}</div>`;
}
function bullets(text){return String(text||'').split('•').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean)}
function regionHTML(text){
  const items=bullets(text);
  if(!items.length)return '';
  const rows=items.map(it=>{
    const m=it.match(/^(서울|수도권|비수도권)\s*\((.*)\)\s*$/);
    if(m)return `<div class="region"><div class="rg">${m[1]}</div><div class="us">${esc(m[2].replace(/\s*등$/,' 등'))}</div></div>`;
    return `<div class="region"><div class="rg"></div><div class="us">${esc(it)}</div></div>`;
  }).join('');
  return rows;
}
function careerHTML(text){
  const items=bullets(text);
  if(items.length<=1&&!/•/.test(text))return `<div>${esc(text)}</div>`;
  return '<ul class="career">'+items.map(it=>{const m=it.match(/^([^()]{1,24}?)\((.*)\)$/);return m?`<li><b>${esc(m[1])}</b> · ${esc(m[2])}</li>`:`<li>${esc(it)}</li>`}).join('')+'</ul>';
}
function infoCell(obj,kind){
  if(!obj)return '<span class="muted">안내서에 별도 기재 없음</span>';
  const f=kind==='univ'?regionHTML:kind==='career'?careerHTML:(t=>esc(t.replace(/^•\s*/,'')));
  if(obj.subs)return obj.subs.map(s=>`<div style="margin:0 0 10px"><div class="sub">${esc(s.label)}</div>${f(s.text)}</div>`).join('');
  return f(obj.text);
}
function seriesLanes(se,highlight){
  return LANES.map(l=>{
    const o=se.subjects[l];if(!o)return '';
    let b='';
    o.groups.forEach(g=>{
      if(g.group)b+=`<div class="gsub">${esc(g.group)}</div>`;
      b+=g.items.map(s=>chip(s,{cls:highlight&&!highlight.has(s)?'':''})).join('');
    });
    if(o.note)b+=`<div class="note">※ ${esc(o.note)}</div>`;
    return `<div class="lane"><div class="lane-h">${l}</div><div class="lane-b">${b}</div></div>`;
  }).join('');
}

function matrix(ids,editable,onlyCommon){
  if(!ids.length)return '<div class="box empty">비교할 학과를 위에서 선택하세요.</div>';
  let rows='';
  LANES.forEach(l=>{
    const set=[];ids.forEach(id=>(DEP[id].subjects[l]||[]).forEach(s=>{if(!set.includes(s))set.push(s)}));
    const cnt=s=>ids.filter(id=>(DEP[id].subjects[l]||[]).includes(s)).length;
    let list=set.sort((a,b)=>cnt(b)-cnt(a)||gIdx(a)-gIdx(b));
    if(onlyCommon)list=list.filter(s=>cnt(s)===ids.length);
    rows+=`<tr class="lane-row"><td colspan="${ids.length+2}">${l} <span class="muted" style="font-weight:400">${list.length}과목</span></td></tr>`;
    if(!list.length)rows+=`<tr><td colspan="${ids.length+2}" class="muted">공통 과목 없음</td></tr>`;
    list.forEach(s=>{const c=cnt(s);
      rows+=`<tr class="${c===ids.length&&ids.length>1?'all':''}"><td class="sn" style="--c:${gColor(s)}"><button class="chip" style="--c:${gColor(s)};border:0;padding:0;background:none" data-subj="${esc(s)}">${esc(s)}</button></td>${ids.map(id=>`<td>${(DEP[id].subjects[l]||[]).includes(s)?'<span class="dot" aria-label="포함"></span>':''}</td>`).join('')}<td class="c">${c}/${ids.length}</td></tr>`});
  });
  const head=ids.map(id=>`<th><span class="dn">${esc(DEP[id].name)}</span><small class="muted">${esc(SER[DEP[id].series].name)}</small>${editable?`<br><button class="rm" data-rm="${id}">빼기</button>`:''}</th>`).join('');
  return `<div class="box cmp-wrap"><table class="cmp"><thead><tr><th style="text-align:left">과목</th>${head}<th>포함</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

let subjFilter='', subjLaneF='전체';
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const choOf=s=>[...s].map(c=>{const u=c.charCodeAt(0);return u>=0xAC00&&u<=0xD7A3?CHO[Math.floor((u-0xAC00)/588)]:c}).join('');
const isJamo=c=>c>='\u3131'&&c<='\u318E';
function subjQuery(raw){
  // 조합 중인 자모(ㅌ 등)만 남은 경우 그 글자는 무시하고, 초성만 입력하면 초성 검색
  const t=String(raw||'').replace(/\s/g,'');
  if(!t)return null;
  const jamoOnly=[...t].every(isJamo);
  if(jamoOnly)return {mode:'cho',q:t};
  return {mode:'text',q:t.replace(/[\u3131-\u318E]+$/,'')};
}
function subjMatch(s,qq){
  if(!qq||!qq.q)return true;
  const k=s.replace(/\s/g,'');
  return qq.mode==='cho'?choOf(k).includes(qq.q):k.includes(qq.q);
}
function subjListHTML(name){
  const allS=Array.from(new Set([...Object.keys(SIDX),...Object.keys(SUBJ_SER)]));
  const maxN=Math.max(...allS.map(s=>(SIDX[s]||[]).length));
  const qq=subjQuery(subjFilter);
  const filt=allS.filter(s=>subjMatch(s,qq)&&(subjLaneF==='전체'||subjLane(s)===subjLaneF));
  let list='';
  GORDER.forEach((g,gi)=>{
    const items=filt.filter(s=>gIdx(s)===gi).sort((a,b)=>(SIDX[b]||[]).length-(SIDX[a]||[]).length||a.localeCompare(b,'ko'));
    if(!items.length)return;
    list+=`<div class="sgroup"><h4><i style="background:var(--g${gi})"></i>${g}<span class="muted" style="font-weight:400;margin-left:auto">${items.length}</span></h4>`+
      items.map(s=>{const n=(SIDX[s]||[]).length;return `<button class="srow ${s===name?'on':''}" data-subj="${esc(s)}" style="--c:var(--g${gi})"><span>${esc(s)}</span><span class="bar"><span style="width:${n/maxN*100}%"></span></span><span class="num">${n}</span></button>`}).join('')+'</div>';
  });
  if(!list)list=`<div class="empty">‘${esc(subjFilter)}’와(과) 맞는 과목이 없습니다. 글자 수를 줄이거나 초성(예: ㅅㅎ)으로 찾아보세요.</div>`;
  return list;
}
function viewSubject(name){
  const allS=Array.from(new Set([...Object.keys(SIDX),...Object.keys(SUBJ_SER)]));
  if(name&&!allS.includes(name))name=null;
  let det='';
  if(name){
    const hits=SIDX[name]||[];
    const lanesUsed=[...new Set(hits.map(h=>h.l))];
    det=`<div class="sdetail"><h2>${esc(name)}</h2><div class="meta"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${gColor(name)};margin-right:6px"></span>${esc(D.groups[name]||'')} · ${lanesUsed.join(', ')||'학과 예시에는 없음'} · <b>${hits.length}</b>개 학과 예시에 포함</div>${EVAL.panel(name)}`;
    D.fields.forEach(f=>{
      const hs=hits.filter(h=>h.d.field===f.name);
      if(!hs.length)return;
      det+=`<div class="byfield" style="--acc:${acc(f.name)}"><h5><i></i>${esc(f.name)} <span class="muted" style="font-weight:400">${hs.length}</span></h5><div class="row">${hs.map(h=>`<button class="dchip" data-dept="${h.d.id}">${esc(h.d.name)}<small>${esc(SER[h.d.series].name.replace(' 계열',''))}${lanesUsed.length>1?' · '+h.l.replace(' 선택',''):''}</small></button>`).join('')}</div></div>`;

/* ---- PDF 텍스트 추출 (외부 라이브러리 없이 동작) ---- */
async function inflate(bytes){
  for(const fmt of ['deflate','deflate-raw']){
    try{
      const ds=new DecompressionStream(fmt);
      const w=ds.writable.getWriter();
      w.write(bytes); w.close();
      const rd=ds.readable.getReader(); const chunks=[]; let len=0;
      while(true){const {done,value}=await rd.read();if(done)break;chunks.push(value);len+=value.length}
      const out=new Uint8Array(len);let p=0;chunks.forEach(c=>{out.set(c,p);p+=c.length});
      if(out.length)return out;
    }catch(e){}
  }
  return null;
}
function latin1(bytes){let out='';const CH=8192;for(let i=0;i<bytes.length;i+=CH)out+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));return out}
async function pdfText(buf){
  const bytes=new Uint8Array(buf), raw=latin1(bytes);
  if(raw.slice(0,5)!=='%PDF-')throw new Error('PDF 파일이 아닙니다.');
  const objs={};
  const re=/(\d+)\s+\d+\s+obj\b/g; let m;
  while((m=re.exec(raw))){
    const num=+m[1], start=m.index+m[0].length;
    const end=raw.indexOf('endobj',start); if(end<0)continue;
    const body=raw.slice(start,end);
    const sIdx=body.indexOf('stream');
    let dict=body, data=null;
    if(sIdx>=0){
      dict=body.slice(0,sIdx);
      let p=start+sIdx+6;
      if(raw[p]==='\r')p++; if(raw[p]==='\n')p++;
      const e2=raw.lastIndexOf('endstream',end);
      const lenM=/\/Length\s+(\d+)(?!\s+\d+\s+R)/.exec(dict);
      if(lenM&&p+ +lenM[1]<=bytes.length)data=bytes.subarray(p,p+ +lenM[1]);
      else if(e2>p)data=bytes.subarray(p,e2);
    }
    objs[num]={dict,data};
  }
  const refOf=v=>{const r=/^\s*(\d+)\s+\d+\s+R/.exec(v||'');return r?+r[1]:null};
  const get=async n=>{const o=objs[n];if(!o)return null;
    if(o.text!==undefined)return o.text;
    if(!o.data)return o.text=null;
    let d=o.data;
    if(/\/FlateDecode/.test(o.dict)){const inf=await inflate(d);if(!inf)return o.text=null;d=inf}
    return o.text=latin1(d)};
  /* ObjStm 안의 객체 펼치기 */
  for(const n of Object.keys(objs)){
    if(!/\/ObjStm/.test(objs[n].dict))continue;
    const t=await get(+n); if(!t)continue;
    const N=+(/\/N\s+(\d+)/.exec(objs[n].dict)||[])[1]||0;
    const first=+(/\/First\s+(\d+)/.exec(objs[n].dict)||[])[1]||0;
    const head=t.slice(0,first).trim().split(/\s+/).map(Number);
    for(let i=0;i<N;i++){
      const num=head[2*i], off=head[2*i+1];
      const nxt=(i+1<N)?first+head[2*i+3]:t.length;
      if(objs[num]&&objs[num].dict)continue;
      objs[num]={dict:t.slice(first+off,nxt),data:null};
    }
  }
  /* ToUnicode CMap */
  const cmapCache={};
  async function cmapOf(objNum){
    if(cmapCache[objNum])return cmapCache[objNum];
    const t=await get(objNum)||'';
    const map={};
    const hex2=h=>{let o='';for(let i=0;i<h.length;i+=4)o+=String.fromCharCode(parseInt(h.substr(i,4),16));return o};
    (t.match(/beginbfchar([\s\S]*?)endbfchar/g)||[]).forEach(blk=>{
      const pairs=blk.match(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g)||[];
      pairs.forEach(p=>{const q=/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/.exec(p);map[parseInt(q[1],16)]=hex2(q[2])});
    });
    (t.match(/beginbfrange([\s\S]*?)endbfrange/g)||[]).forEach(blk=>{
      const lineRe=/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*(?:<([0-9A-Fa-f]+)>|\[([\s\S]*?)\])/g;let q;
      while((q=lineRe.exec(blk))){
        const lo=parseInt(q[1],16),hi=parseInt(q[2],16);
        if(q[3]){const base=parseInt(q[3].slice(-4),16);for(let c=lo;c<=hi&&c-lo<65535;c++)map[c]=String.fromCharCode(base+(c-lo))}
        else{const arr=q[4].match(/<([0-9A-Fa-f]+)>/g)||[];arr.forEach((a,i)=>{map[lo+i]=hex2(a.replace(/[<>]/g,''))})}
      }
    });
    return cmapCache[objNum]=map;
  }
  async function fontInfo(objNum){
    const d=(objs[objNum]||{}).dict||'';
    const tu=refOf((/\/ToUnicode\s+([^\/>]+)/.exec(d)||[])[1]);
    const two=/\/Type0/.test(d);
    return {two,map:tu?await cmapOf(tu):null};
  }
  /* 페이지별 텍스트 */
  const balanced=(t,i)=>{ /* i: '<<' 시작 위치 */
    let d=0;
    for(let p=i;p<t.length-1;p++){
      if(t[p]==='<'&&t[p+1]==='<'){d++;p++}
      else if(t[p]==='>'&&t[p+1]==='>'){d--;p++;if(!d)return t.slice(i,p+1)}
    }
    return t.slice(i);
  };
  const sub=(t,key)=>{ /* 사전 안의 key 값을 사전 문자열로 돌려줌 */
    if(!t)return null;
    const i=t.indexOf(key); if(i<0)return null;
    let p=i+key.length;
    while(p<t.length&&/\s/.test(t[p]))p++;
    if(t[p]==='<'&&t[p+1]==='<')return balanced(t,p);
    const r=/^(\d+)\s+\d+\s+R/.exec(t.slice(p,p+24));
    if(r&&objs[+r[1]])return objs[+r[1]].dict;
    return null;
  };
  const pages=Object.keys(objs).filter(n=>/\/Type\s*\/Page[^s]/.test(objs[n].dict+' '));
  let out='';
  const decodeStr=(str,f)=>{
    let o='';
    if(f&&f.two){for(let i=0;i+1<str.length;i+=2){const c=(str.charCodeAt(i)<<8)|str.charCodeAt(i+1);o+=f.map&&f.map[c]!==undefined?f.map[c]:''}}
    else{for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);o+=f&&f.map&&f.map[c]!==undefined?f.map[c]:String.fromCharCode(c)}}
    return o;
  };
  for(const pn of pages){
    const pd=objs[pn].dict;
    const resTxt=sub(pd,'/Resources');
    const fonts={};
    const fd=sub(resTxt,'/Font');
    if(fd){const fr=/\/([^\s\/<>]+)\s+(\d+)\s+\d+\s+R/g;let q;
      while((q=fr.exec(fd)))fonts[q[1]]=await fontInfo(+q[2]);}
    let contents=[];
    const cRef=refOf((/\/Contents\s+([^\/>\]]+)/.exec(pd)||[])[1]);
    if(cRef)contents=[cRef];
    else{const arr=(/\/Contents\s*\[([\s\S]*?)\]/.exec(pd)||[])[1];
      if(arr)contents=(arr.match(/(\d+)\s+\d+\s+R/g)||[]).map(x=>+/(\d+)/.exec(x)[1])}
    let content='';
    for(const c of contents)content+=(await get(c))||'';
    if(!content)continue;
    let cur=null, stack=[], i=0, n=content.length;
    const isDigit=c=>c>='0'&&c<='9';
    const readString=()=>{ /* i는 '(' 위치 */
      let d=0,o='';
      for(;i<n;i++){
        const c=content[i];
        if(c==='\\'){
          const e=content[++i];
          if(e>='0'&&e<='7'){let oct=e;for(let k=0;k<2&&content[i+1]>='0'&&content[i+1]<='7';k++)oct+=content[++i];o+=String.fromCharCode(parseInt(oct,8))}
          else o+=({n:'\n',r:'\r',t:'\t',b:'\b',f:'\f'})[e]!==undefined?({n:'\n',r:'\r',t:'\t',b:'\b',f:'\f'})[e]:e;
          continue;
        }
        if(c==='('){d++;if(d===1)continue;o+=c;continue}
        if(c===')'){d--;if(!d){i++;return o}o+=c;continue}
        if(d)o+=c;
      }
      return o;
    };
    const readHex=()=>{ /* i는 '<' 위치 */
      let h='';i++;
      for(;i<n&&content[i]!=='>';i++){if(/[0-9A-Fa-f]/.test(content[i]))h+=content[i]}
      i++;
      if(h.length%2)h+='0';
      let o='';for(let k=0;k<h.length;k+=2)o+=String.fromCharCode(parseInt(h.substr(k,2),16));
      return o;
    };
    while(i<n){
      const c=content[i];
      if(c==='('){stack.push({t:'s',v:readString()});continue}
      if(c==='<'&&content[i+1]!=='<'){stack.push({t:'s',v:readHex()});continue}
      if(c==='<'&&content[i+1]==='<'){i+=2;continue}
      if(c==='>'){i++;continue}
      if(c==='/'){i++;let nm='';while(i<n&&!/[\s\/\[\]()<>]/.test(content[i]))nm+=content[i++];stack.push({t:'name',v:nm});continue}
      if(c==='['||c===']'){i++;continue}
      if(isDigit(c)||((c==='-'||c==='.')&&isDigit(content[i+1]))){let num='';while(i<n&&/[-\d.]/.test(content[i]))num+=content[i++];stack.push({t:'n',v:parseFloat(num)});continue}
      if(/[A-Za-z'"*]/.test(c)){
        let op='';while(i<n&&/[A-Za-z0-9*'"]/.test(content[i]))op+=content[i++];
        if(op==='Tf'){const nm=stack.filter(x=>x.t==='name').pop();cur=nm?fonts[nm.v]||null:cur}
        else if(op==='Tj'||op==="'"||op==='"'){const st=stack.filter(x=>x.t==='s').pop();if(st)out+=decodeStr(st.v,cur);if(op!=='Tj')out+='\n'}
        else if(op==='TJ'){stack.forEach(x=>{if(x.t==='s')out+=decodeStr(x.v,cur);else if(x.t==='n'&&x.v<-180)out+=' '})}
        else if(op==='Td'||op==='TD'||op==='T*'||op==='ET'||op==='BT')out+='\n';
        stack=[];continue;
      }
      i++;
    }
    out+='\n';
  }
  return out;
}

/* ---- 텍스트에서 과목명 찾기 ---- */
function matchSubjects(text){
  let flat=String(text||'').replace(/[\u00A0\t]/g,' ').replace(/[ㆍ]/g,'·').replace(/\s/g,'');
  const found=[];
  const sorted=[...ALL_SUBJ].sort((a,b)=>b.replace(/\s/g,'').length-a.replace(/\s/g,'').length);
  sorted.forEach(name=>{
    const short=SHORT(name);
    let hit=false;
    for(const k of keys(name)){
      if(!k)continue;
      let i=flat.indexOf(k);
      while(i>=0){
        const before=flat[i-1]||'', after=flat[i+k.length]||'';
        const bad=short&&(/[가-힣A-Za-z]/.test(before)||/[가-힣A-Za-z]/.test(after));
        if(!bad){
          hit=true;
          /* 이미 찾은 자리는 가려서 더 짧은 이름이 그 안에서 또 잡히지 않게 한다 */
          flat=flat.slice(0,i)+'\u0001'.repeat(k.length)+flat.slice(i+k.length);
          i=flat.indexOf(k,i+k.length);
        }else i=flat.indexOf(k,i+1);
      }
      if(hit)break;
    }
    if(hit&&!found.includes(name))found.push(name);
  });
  return found.sort((a,b)=>gIdx(a)-gIdx(b)||a.localeCompare(b,'ko'));
}

function bindFit(){
  const q=id=>document.getElementById(id);
  main.querySelectorAll('[data-fitmode]').forEach(b=>b.onclick=()=>{fitMode=b.dataset.fitmode;viewFit()});
  const fileIn=q('pdfIn');
  if(fileIn){
    q('fileBtn').onclick=()=>fileIn.click();
    fileIn.onchange=()=>fileIn.files[0]&&readPDF(fileIn.files[0]);
    const dz=q('drop');
    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('hot')}));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('hot')}));
    dz.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)readPDF(f)});
  }
  if(q('pasteGo'))q('pasteGo').onclick=()=>applyFound(matchSubjects(q('pasteArea').value),'붙여넣은 텍스트');
  if(q('pickGrid'))q('pickGrid').onchange=e=>{const c=e.target;if(!c.dataset.pick)return;
    const n=c.dataset.pick;
    if(c.checked){if(!school.subjects.includes(n))school.subjects.push(n)}
    else school.subjects=school.subjects.filter(x=>x!==n);
    school.subjects.sort((a,b)=>gIdx(a)-gIdx(b)||a.localeCompare(b,'ko'));
    school.source=school.source||'직접 선택';schoolSync()};
  if(q('clrSchool'))q('clrSchool').onclick=()=>{if(confirm('등록된 학교 개설 과목을 모두 지울까요?')){school.subjects=[];school.source='';schoolSync();viewFit()}};
  main.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{school.subjects=school.subjects.filter(x=>x!==b.dataset.del);schoolSync();viewFit()});
  if(q('addBtn'))q('addBtn').onclick=()=>{const v=q('addSubj').value.trim();
    if(!v)return;
    if(!ALL_SUBJ.includes(v)){alert('과목 목록에 없는 이름입니다. 목록에서 골라 주세요.');return}
    if(!school.subjects.includes(v))school.subjects.push(v);
    school.subjects.sort((a,b)=>gIdx(a)-gIdx(b)||a.localeCompare(b,'ko'));schoolSync();viewFit()};
  if(q('wishSel'))q('wishSel').onchange=e=>{const v=e.target.value;
    if(v&&!fitWish.includes(v)){if(fitWish.length>=3)fitWish.shift();fitWish.push(v)}viewFit()};
  if(q('wishClr'))q('wishClr').onclick=()=>{fitWish=[];viewFit()};
  main.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{fitWish=fitWish.filter(x=>x!==b.dataset.wdel);viewFit()});
}
async function readPDF(file){
  const msg=document.getElementById('parseMsg');
  msg.innerHTML=`<div class="hint" style="margin-top:10px">‘${esc(file.name)}’에서 과목명을 찾는 중…</div>`;
  try{
    const buf=await file.arrayBuffer();
    const text=await pdfText(buf);
    const found=matchSubjects(text);
    if(!found.length){
      msg.innerHTML=`<div class="warn" style="margin-top:10px">이 PDF에서는 과목명을 읽지 못했습니다. 스캔한 이미지이거나 글꼴 정보가 없는 파일일 수 있습니다. PDF를 열어 전체 복사한 뒤 <b>텍스트로 붙여넣기</b>를 쓰거나, <b>목록에서 직접 고르기</b>로 등록해 주세요.</div>`;
      return;
    }
    applyFound(found,file.name);
  }catch(e){
    msg.innerHTML=`<div class="warn" style="margin-top:10px">파일을 읽지 못했습니다(${esc(e.message)}). 텍스트로 붙여넣기나 직접 고르기를 이용해 주세요.</div>`;
  }
}
function applyFound(found,src){
  if(!found.length){document.getElementById('parseMsg').innerHTML=`<div class="warn" style="margin-top:10px">과목명을 찾지 못했습니다. 조사표의 과목명이 들어간 부분을 붙여넣어 주세요.</div>`;return}
  school.subjects=found;school.source=src;schoolSync();
  fitMode='';viewFit();
  const msg=document.getElementById('parseMsg');
  if(msg)msg.innerHTML=`<div class="ok" style="margin-top:10px">${esc(src)}에서 <b>${found.length}개</b> 과목을 찾았습니다. 아래 목록을 확인하고 틀린 과목은 ×로 빼거나, 빠진 과목은 추가해 주세요.</div>`;
}

const K=s=>String(s||'').replace(/\s/g,'').toLowerCase();
const flat=o=>!o?'':o.subs?o.subs.map(x=>x.label+' '+x.text).join(' '):o.text;
const SEARCH=D.depts.map(d=>({d,name:K(d.name),sim:flat(d.similar),car:flat(d.career),maj:d.majors.map(m=>m.label+' '+m.text).join(' '),univ:flat(d.univ)}));
function snippet(text,q){
  const t=text.replace(/\s+/g,' ');const tk=K(t);const i=tk.indexOf(q);if(i<0)return '';
  let c=0,start=0;for(let j=0;j<t.length;j++){if(t[j]!==' '){if(c===i){start=j;break}c++}}
  const s=Math.max(0,start-18),e=Math.min(t.length,start+q.length+40);
  const seg=t.slice(s,e);
  return (s>0?'…':'')+esc(seg).replace(new RegExp(esc(t.slice(start,start+q.length)).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')),m=>`<mark>${m}</mark>`)+(e<t.length?'…':'');
}

   {k:'contract',n:'계약학과',parts:[{l:'선발 대학 및 학과',t:C.rows.map(r=>r.kind+' '+r.feature+' '+r.examples.join(' ')).join(' ')},{l:'과목 선택 정보',t:C.subjectInfo.map(r=>r.join(' ')).join(' ')},{l:'소개',t:C.desc+' '+C.typeDesc}]},

function doSearch(){
  const raw=$('#q').value.trim(), q=K(raw), box=$('#results');
  if(!q){box.classList.remove('open');return}
  const g1=[],g2=[],g3=[],g4=[];
  SEARCH.forEach(x=>{
    if(x.name.includes(q))g1.push({go:'dept/'+x.d.id,t:esc(x.d.name),s:esc(SER[x.d.series].name)});
    else{
      const fields=[['유사 학과',x.sim],['졸업 후 진로',x.car],['전공 교과목',x.maj],['개설 대학',x.univ]];
      for(const [lab,txt] of fields){if(K(txt).includes(q)){(lab==='개설 대학'?g4:g3).push({go:'dept/'+x.d.id,t:esc(x.d.name)+` <span class="muted" style="font-size:12px">${lab}</span>`,s:snippet(txt,q)});break}}
    }
  });
  D.series.forEach(s=>{if(K(s.name).includes(q))g1.push({go:'series/'+s.id,t:esc(s.name),s:esc(s.field)})});
  [['autonomy','자율전공'],['contract','계약학과'],['advanced','첨단학과']].forEach(([k,n])=>{if(K(n).includes(q))g1.push({go:'special/'+k,t:n,s:'기타 모집 단위'})});
  const g5=[];
  SPTEXT.forEach(x=>{const hit=x.parts.find(p=>K(p.t).includes(q));if(hit)g5.push({go:'special/'+x.k,t:esc(x.n)+` <span class="muted" style="font-size:12px">${hit.l}</span>`,s:snippet(hit.t,q)})});
  Object.keys({...SIDX,...SUBJ_SER}).forEach(s=>{if(K(s).includes(q))g2.push({go:'subject/'+encodeURIComponent(s),t:esc(s),s:`${D.groups[s]||''} · ${(SIDX[s]||[]).length}개 학과 예시`})});
  resItems=[];let h='';
  const sec=(title,arr,max)=>{if(!arr.length)return;h+=`<h6>${title} ${arr.length>max?`(${max}/${arr.length})`:''}</h6>`;arr.slice(0,max).forEach(it=>{h+=`<button data-i="${resItems.length}" role="option"><span>${it.t}</span><span class="rs">${it.s}</span></button>`;resItems.push(it)})};
  sec('학과·계열',g1,12);sec('과목',g2,10);sec('내용에서 찾음',g3,15);sec('개설 대학',g4,15);sec('자율전공·계약학과·첨단학과',g5,3);
  if(!h)h=`<div class="none">‘${esc(raw)}’와 일치하는 학과·과목이 없습니다. 다른 낱말로 검색해 보세요.</div>`;
  box.innerHTML=h;box.classList.add('open');resAct=-1;
}
function initSearch(){
  const q=$('#q'),box=$('#results');
  q.addEventListener('input',doSearch);
  q.addEventListener('focus',()=>{if(q.value.trim())doSearch()});
  q.addEventListener('keydown',e=>{
    const btns=box.querySelectorAll('button[data-i]');
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!btns.length)return;resAct=(resAct+(e.key==='ArrowDown'?1:-1)+btns.length)%btns.length;btns.forEach((b,i)=>b.classList.toggle('act',i===resAct));btns[resAct].scrollIntoView({block:'nearest'})}
    if(e.key==='Enter'){const i=resAct>=0?resAct:0;if(resItems[i]){go(resItems[i].go);box.classList.remove('open');q.blur()}}
    if(e.key==='Escape'){box.classList.remove('open')}
  });
  box.addEventListener('mousedown',e=>{const b=e.target.closest('button[data-i]');if(!b)return;e.preventDefault();go(resItems[+b.dataset.i].go);box.classList.remove('open');q.blur()});
  document.addEventListener('click',e=>{if(!e.target.closest('.search'))box.classList.remove('open')});
}

const KIND_NAME={공통:'공통과목',일반:'일반선택',진로:'진로선택',융합:'융합선택'};
const DATA=[];
for(const [area,kinds] of Object.entries(RAW)){
  for(const [k,list] of Object.entries(kinds)){
    list.forEach(s=>{
      let t='t1';
      if(area==='체육'||area==='예술'||s.startsWith('과학탐구실험')) t='t3';
      else if(area==='교양') t='t4';
      else if(NINE.includes(s)) t='t2';
      DATA.push({area,kind:KIND_NAME[k],subj:s,type:t});
    });
  }
}

/* ---- 학과 안내 데이터와 연결 ---- */
const nk=s=>String(s||'').replace(/\s/g,'').replace(/Ⅰ/g,'1').replace(/Ⅱ/g,'2').toLowerCase();
const BYK={}; DATA.forEach(d=>BYK[nk(d.subj)]=d);
const GK={}; GUIDE_SUBJ.forEach(s=>GK[nk(s)]=s);
const guideName=s=>GK[nk(s)]||null;
const recN=s=>{const g=guideName(s);return g?(SIDX[g]||[]).length:0};
function evalOf(name){
  const d=BYK[nk(name)]; if(d) return d;
  const g=D.groups[name];
  if(g==='체육'||g==='예술') return {subj:name,area:g,kind:'',type:'t3'};
  if(g==='교양') return {subj:name,area:g,kind:'',type:'t4'};
  if(g==='제2외국어/한문') return {subj:name,area:g,kind:'',type:'t1'};
  return null;
}
const HK={}; Object.entries(HIER).forEach(([k,S])=>S.nodes.forEach(n=>HK[nk(n.id)]={k,id:n.id}));
const hierOf=name=>HK[nk(name)]||null;
const subjLink=x=>{const g=guideName(x);return g?`<button class="lnkbtn" data-subj="${esc(g)}">${esc(x)}</button>`:esc(x)};

const byId=id=>document.getElementById(id);
const ox=b=>b?'<span class="ev-o">●</span>':'<span class="ev-x">—</span>';

/* ---- 위계 그래프 ---- */
const preReq=(S,id)=>S.edges.filter(e=>e[1]===id&&(e[2]==='s'||e[2]==='h')).map(e=>e[0]);
const preRec=(S,id)=>S.edges.filter(e=>e[1]===id&&(e[2]==='r'||e[2]==='rh')).map(e=>e[0]);
const nextOf=(S,id)=>S.edges.filter(e=>e[0]===id).map(e=>e[1]);
function anc(S,id,acc=new Set()){S.edges.forEach(([a,b,t])=>{if(b===id&&(t==='s'||t==='h')&&!acc.has(a)){acc.add(a);anc(S,a,acc)}});return acc}
function descOf(S,id,acc=new Set()){S.edges.forEach(([a,b])=>{if(a===id&&!acc.has(b)){acc.add(b);descOf(S,b,acc)}});return acc}

/* ---------- 과목별 평가방식 ---------- */
function bodySearch(){
  return `<div class="ev-card no-print">
    <input id="evq" class="ev-input" type="search" placeholder="과목명 검색 (예: 미적분, 기후, 체육, 화학)" autocomplete="off" value="${esc(st.q)}">
    <div class="ev-lbl">교과(군)</div><div class="ev-chips" id="evArea"></div>
    <div class="ev-lbl">과목 구분</div><div class="ev-chips" id="evKind"></div>
    <div class="ev-lbl">평가 유형</div><div class="ev-chips" id="evType"></div>
    <div class="ev-count" id="evCount"></div></div>
  <div class="ev-legend" id="evLegend"></div>
  <div class="ev-card" style="padding:0"><div class="ev-wrapx"><table class="ev-tbl click">
    <thead><tr><th>교과(군)</th><th>구분</th><th>과목</th><th>평가 유형</th><th class="ev-hm">성취도</th><th class="ev-hm">석차등급</th><th class="ev-hm">원점수·평균</th><th class="ev-hm">분포비율</th><th class="ev-hm">추천 학과</th></tr></thead>
    <tbody id="evTb"></tbody></table></div></div>
  <p class="muted" style="font-size:13px">과목을 누르면 학생부 기재 항목, 과목 위계, 이 과목을 추천하는 학과로 이어집니다. <span class="ev-tag" style="margin:0">위계</span> 표시는 수학·과학 위계도에 있는 과목입니다.</p>`;
}
const norm=s=>s.replace(/\s/g,'').toLowerCase().replace(/ⅰ/g,'1').replace(/ⅱ/g,'2').replace(/i{2}$/,'2');
function match(d){
  if(st.area!=='전체'&&d.area!==st.area) return false;
  if(st.kind!=='전체'&&d.kind!==st.kind) return false;
  if(st.type!=='전체'&&d.type!==st.type) return false;
  if(st.q){if(!norm(d.subj+d.area).includes(norm(st.q))) return false}
  return true;
}
function hl(s){
  if(!st.q) return esc(s);
  const j=s.toLowerCase().indexOf(st.q.toLowerCase());
  if(j<0) return esc(s);
  return esc(s.slice(0,j))+'<mark class="ev-mark">'+esc(s.slice(j,j+st.q.length))+'</mark>'+esc(s.slice(j+st.q.length));
}
function chipsTo(el,vals,key,label=v=>v){
  el.innerHTML=vals.map(v=>`<button class="ev-chip${st[key]===v?' on':''}" data-v="${esc(v)}">${esc(label(v))}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('.ev-chip');if(!b)return;st[key]=b.dataset.v;renderSearch()};
}
function renderSearch(){
  chipsTo(byId('evArea'),['전체',...Object.keys(RAW)],'area');
  chipsTo(byId('evKind'),['전체','공통과목','일반선택','진로선택','융합선택'],'kind');
  chipsTo(byId('evType'),['전체','t1','t2','t3','t4'],'type',v=>v==='전체'?'전체':TYPES[v].name);
  byId('evLegend').innerHTML=Object.entries(TYPES).map(([k,t])=>`<button class="ev-lg ${k}${st.type===k?' on':''}" data-t="${k}"><b>${t.name} · ${DATA.filter(d=>d.type===k).length}과목</b><span>${t.desc}</span></button>`).join('');
  const rows=DATA.filter(match);
  byId('evCount').textContent=`검색 결과 ${rows.length}개 과목 / 전체 ${DATA.length}개`;
  byId('evTb').innerHTML=rows.length?rows.map(d=>{const T=TYPES[d.type],n=recN(d.subj);return `<tr data-i="${DATA.indexOf(d)}">
    <td>${esc(d.area)}</td><td class="ev-kind">${d.kind}</td><td class="sj">${hl(d.subj)}${hierOf(d.subj)?'<span class="ev-tag">위계</span>':''}</td>
    <td><span class="ev-badge b-${d.type}">${T.name}</span></td>
    <td class="ev-hm">${T.ach}</td><td class="ev-hm">${T.rank?'1~5등급':'<span class="ev-x">미산출</span>'}</td>
    <td class="ev-hm">${ox(T.raw)}</td><td class="ev-hm">${ox(T.dist)}</td>
    <td class="ev-hm">${n?n+'개':'<span class="ev-x">—</span>'}</td></tr>`}).join('')
    :'<tr><td colspan="9" class="ev-empty">검색 결과가 없습니다. 과목명 일부만 입력해 보세요.</td></tr>';
}
function bindSearch(){
  renderSearch();
  const q=byId('evq');
  const upd=()=>{st.q=q.value.trim();renderSearch()};
  q.addEventListener('input',upd);q.addEventListener('compositionend',upd);
  byId('evLegend').onclick=e=>{const l=e.target.closest('.ev-lg');if(!l)return;st.type=st.type===l.dataset.t?'전체':l.dataset.t;renderSearch()};
  byId('evTb').onclick=e=>{const r=e.target.closest('tr[data-i]');if(r)openModal(DATA[+r.dataset.i])};
}

/* ---------- 상세 창 ---------- */
function ensureModal(){
  if(byId('evMask'))return;
  const m=document.createElement('div');
  m.className='ev-mask';m.id='evMask';m.innerHTML='<div class="ev-modal" id="evModal" role="dialog" aria-modal="true"></div>';
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-evclose]'))close()});
}
function openModal(d){
  if(!d)return;
  ensureModal();
  const T=TYPES[d.type];
  const items=[['원점수',T.raw],['과목평균',T.raw],['표준편차',T.sd],['성취도',true,T.ach],['수강자수',T.raw],['성취도별 분포비율',T.dist],['석차등급',T.rank,T.rank?'1~5등급':''],['세부능력 및 특기사항',true]];
  let extra='';
  if(d.type==='t1') extra='성취도(A~E)는 학업성취율로 정하는 절대평가, 석차등급은 수강자 중 상대적 위치로 정하는 상대평가입니다. 두 결과를 함께 기재합니다.';
  if(d.type==='t2') extra='사회·과학 융합선택 9과목은 국가교육위원회 의결에 따라 석차등급을 기재하지 않습니다. 성취도와 분포비율로 성적을 확인합니다.';
  if(d.type==='t3') extra=d.subj.startsWith('과학탐구실험')?'과학탐구실험1·2는 공통과목이지만 3단계 성취도(A·B·C)만 기재하며 석차등급을 산출하지 않습니다.':'체육·예술 교과는 3단계 성취도(A·B·C)만 기재하며 원점수·석차등급을 산출하지 않습니다.';
  if(d.type==='t4') extra='교양 교과는 성취도를 P(이수)로 기재합니다.';
  const hh=hierOf(d.subj), g=guideName(d.subj), n=recN(d.subj);
  let hier='';
  if(hh){const S=HIER[hh.k],need=preReq(S,hh.id),rec=preRec(S,hh.id),nx=nextOf(S,hh.id);
    hier=`<h3>과목 위계</h3><div class="ev-items">
      <div class="ev-it"><b>선수 과목</b>${need.length?need.map(esc).join(', '):'없음 (출발 과목)'}${rec.length?`<br><span class="ev-kind">권장: ${rec.map(esc).join(', ')}</span>`:''}</div>
      <div class="ev-it"><b>후속 과목</b>${nx.length?nx.map(esc).join(', '):'—'}</div></div>`}
  byId('evModal').innerHTML=`<button class="btn ev-close" data-evclose>닫기</button>
    <span class="ev-badge b-${d.type}">${T.name}</span>
    <h2>${esc(d.subj)}</h2><div class="ev-meta">${esc(d.area)}${d.kind?' · '+d.kind:''}</div>
    <div class="ev-items">${items.map(([nm,ok,v])=>`<div class="ev-it${ok?'':' no'}"><b>${nm}</b>${ok?(v||'기재'):'미기재'}</div>`).join('')}</div>
    <div class="ev-note">${extra}</div>${hier}
    <div class="ev-mbtns">${g?`<button class="btn primary" data-subj="${esc(g)}">이 과목을 추천하는 학과 ${n}개 보기</button>`:'<span class="muted" style="font-size:13px">안내서 학과별 선택 과목 예시에는 없는 과목입니다.</span>'}${hh?`<button class="btn" data-evhier="${hh.k}|${esc(hh.id)}">위계도에서 보기</button>`:''}</div>`;
  byId('evMask').classList.add('on');
}
function close(){const m=byId('evMask');if(m)m.classList.remove('on')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
/* 어느 화면에서든 위계도·평가 상세로 이동 */
document.addEventListener('click',e=>{
  const h=e.target.closest('[data-evhier]');
  if(h){const [k,id]=h.dataset.evhier.split('|');close();H.sub=k;H.sel=id;H.track=null;go('eval/hier');return}
  const m=e.target.closest('[data-evmodal]');
  if(m){openModal(evalOf(m.dataset.evmodal))}
});

/* ---------- 과목으로 찾기 화면용 패널 ---------- */
function panel(name){
  const e=evalOf(name), hh=hierOf(name);
  if(!e&&!hh) return '';
  let h='<div class="ev-panel">';
  if(e){const T=TYPES[e.type];
    h+=`<div class="ev-prow"><span class="ev-plab">평가 방식</span><span><span class="ev-badge b-${e.type}">${T.name}</span> 성취도 ${T.ach} · ${T.rank?'석차등급 1~5':'석차등급 미산출'}</span><button class="lnkbtn" data-evmodal="${esc(name)}">기재 항목</button></div>`}
  if(hh){const S=HIER[hh.k],pre=preReq(S,hh.id),nx=nextOf(S,hh.id);
    h+=`<div class="ev-prow"><span class="ev-plab">과목 위계</span><span>선수 ${pre.length?pre.map(subjLink).join(', '):'없음'} → <b>${esc(hh.id)}</b> → 후속 ${nx.length?nx.map(subjLink).join(', '):'—'}</span><button class="lnkbtn" data-evhier="${hh.k}|${esc(hh.id)}">위계도</button></div>`}
  return h+'</div>';
}

function activeSet(){
  const S=HIER[H.sub];
  if(H.sel&&S.nodes.some(n=>n.id===H.sel)) return new Set([H.sel,...anc(S,H.sel),...descOf(S,H.sel)]);

  return null;
}

    S.nodes.filter(n=>n.col===ci).map(n=>{

    }).join('')+'</div></div>').join('');

function layoutHier(){
  const wrap=byId('hyWrap'),svg=byId('hySvg');
  if(!wrap||!wrap.offsetParent)return;
  wrap.classList.toggle('stack',wrap.clientWidth<700);
  if(wrap.classList.contains('stack')){svg.innerHTML='';return}
  const W=wrap.getBoundingClientRect();
  svg.setAttribute('viewBox',`0 0 ${W.width} ${W.height}`);
  const S=HIER[H.sub],act=activeSet(),el={},col={};
  wrap.querySelectorAll('.hy-node').forEach(n=>el[n.dataset.hy]=n);
  S.nodes.forEach(n=>col[n.id]=n.col);
  let out='<defs>'+[['hyM0','#AAB3C4'],['hyM1','#1B2333']].map(([m,c])=>`<marker id="${m}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join('')+'</defs>';
  S.edges.forEach(([a,b,t])=>{
    if(t!=='s'&&t!=='r')return;
    const ca=col[a],cb=col[b];
    if(!(ca===cb||cb===ca+1)||!el[a]||!el[b])return;
    const A=el[a].getBoundingClientRect(),B=el[b].getBoundingClientRect();
    const on=!!(act&&act.has(a)&&act.has(b));
    let d;
    if(ca===cb){const x=A.left+A.width/2-W.left;d=`M${x},${A.bottom-W.top} L${x},${B.top-W.top-1}`}
    else{const x1=A.right-W.left,y1=A.top+A.height/2-W.top,x2=B.left-W.left-2,y2=B.top+B.height/2-W.top,m=(x1+x2)/2;d=`M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`}
    out+=`<path d="${d}" class="${t==='r'?'dash':''}${on?' on':''}" marker-end="url(#${on?'hyM1':'hyM0'})"/>`;
  });
  svg.innerHTML=out;
}

const CUM=[10,34,66,90,100];
function gradeOf(rank,tie,n){const mid=rank+(tie-1)/2;const p=mid/n*100;for(let g=0;g<5;g++)if(p<=CUM[g]+1e-9)return {g:g+1,p};return {g:5,p}}

    box.innerHTML=`<big>${g}등급</big><br>중간석차 ${(r+(t-1)/2).toFixed(1)}등 · 상위 ${p.toFixed(2)}%`;
  };
  byId('aGo').onclick=()=>{
    const v=+byId('aRate').value,box=byId('aRes');box.classList.add('on');
    if(byId('aRate').value===''||isNaN(v)||v<0||v>100){box.innerHTML='0~100 사이로 입력해 주세요.';return}
    const five=v>=90?'A':v>=80?'B':v>=70?'C':v>=60?'D':v>=40?'E':'I (미이수)';
    const three=v>=80?'A':v>=60?'B':'C';
    box.innerHTML=`5단계 성취도 <big>${five}</big><br>3단계(체육·예술 등) 성취도 <b>${three}</b>${v<40?'<br><span style="color:#B33A55">최소 성취수준 미도달 — 보장지도 대상</span>':''}`;
  };
}

return {view,panel,close};
})();


/* ---- routing ---- */
function go(h){if(location.hash==='#'+h)route();else location.hash=h}
function route(){
  EVAL.close();
  const h=decodeURIComponent(location.hash.slice(1));
  const [v,...rest]=h.split('/');const p=rest.join('/');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===(v==='dept'||v==='series'||!v?'home':v)&&(v!=='dept'&&v!=='series'||false)));
  if(v==='dept')viewDept(p);
  else if(v==='series')viewSeries(p);
  else if(v==='subject')viewSubject(p||null);
  else if(v==='compare')viewCompare(p||null);
  else if(v==='special')viewSpecial(p);
  else if(v==='eval')EVAL.view(p);
  else if(v==='fit')viewFit();
  else{viewHome();document.querySelector('#nav [data-go="home"]').classList.add('on')}
  if(v==='subject'){document.querySelector('#nav [data-go="subject"]').classList.add('on')}
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-go],[data-dept],[data-series],[data-subj],[data-special],[data-field-open]');
  if(!b||b.closest('#side')||b.closest('.results'))return;
  if(b.dataset.go){go(b.dataset.go==='compare'&&compareList.length?'compare/'+compareList.join(','):b.dataset.go);return}
  if(b.dataset.dept)go('dept/'+b.dataset.dept);
  else if(b.dataset.series)go('series/'+b.dataset.series);
  else if(b.dataset.subj)go('subject/'+b.dataset.subj);
  else if(b.dataset.special)go('special/'+b.dataset.special);
  else if(b.dataset.fieldOpen){const f=side.querySelector(`[data-field="${b.dataset.fieldOpen}"]`);if(f){f.classList.add('open');if(innerWidth<=940)side.classList.add('open');f.scrollIntoView({block:'start'})}}
});
$('#menuBtn').onclick=()=>side.classList.toggle('open');
buildSide();initSearch();
addEventListener('hashchange',route);route();
})();
</script>
